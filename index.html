<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SafarNama — Pakistan Tours</title>
  <link rel="stylesheet" href="assets/base.css"/>
  <link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="hero-inner">
        <h1 class="title reveal">Discover Pakistan</h1>
        <p class="lead reveal">From the Indus plains to 8,000-meter giants—plan unforgettable journeys with real, local insight.</p>
        <div class="actions reveal">
          <a class="btn primary" href="destinations.html">Explore Destinations</a>
          <a class="btn" href="trip-plans.html">Build a Trip</a>
        </div>
      </div>
      <div class="orb"></div>
      <div class="orb o2"></div>
    </section>

    <section aria-label="Featured Places">
      <h2 class="reveal">Featured Places</h2>
      <p class="muted reveal">North to South—crowd favorites and hidden gems.</p>
      <div id="featured" class="grid cols-4"></div>
    </section>

    <section aria-label="Best Seasons">
      <h2 class="reveal">When to go</h2>
      <div id="seasons" class="grid cols-4"></div>
    </section>
  </main>

  <script src="assets/global.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
